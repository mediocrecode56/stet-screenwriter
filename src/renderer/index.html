<!doctype html>
<html lang="en" data-theme="dark" class="starting">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self'">
<title>STET</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <nav id="menubar"></nav>
  <div id="drag"></div>
  <div id="docname"><span id="docdot"></span><span id="doctitle" title="Double-click to rename">Untitled</span></div>
</header>
<div id="elbar" data-side="top" data-open="1">
  <div id="eltypes"></div>
  <div class="sep"></div>
  <div id="hlbar"></div>
  <div class="sep"></div>
  <div id="stbar"></div>
  <div class="sep"></div>
  <div id="albar"></div>
  <div class="sep"></div>
  <button id="btn-comment" class="tb" title="Comment on selection (Ctrl+Alt+M)">+NOTE</button>
  <div class="grow"></div>
  <div id="elright">
    <button id="btn-title" class="tb sq" aria-pressed="true" aria-label="Title page"><svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true" shape-rendering="crispEdges"><rect x=".5" y=".5" width="9" height="11" fill="none" stroke="currentColor"/><path d="M3 4.5h4M2.5 6.5h5" stroke="currentColor"/></svg></button>
    <button id="btn-lock" class="tb sq" aria-pressed="false"></button>
    <button id="btn-rev" class="tb" title="Revise with Claude (F7 next suggestion)">REVISE</button>
    <button id="btn-scenes" class="tb" title="Scene navigator (Ctrl+\)">SCENES</button>
    <button id="btn-notes" class="tb" title="Comments (Ctrl+Shift+\)">NOTES</button>
  </div>
</div>
<div id="timeline" hidden></div>
<main id="main">
  <div id="findbar" data-side="top" hidden>
    <input id="find-q" placeholder="find" spellcheck="false">
    <input id="find-r" placeholder="replace with" spellcheck="false">
    <label class="chk"><input type="checkbox" id="find-case">Aa</label>
    <label class="chk"><input type="checkbox" id="find-word">whole</label>
    <span id="find-count"></span>
    <button class="tb" id="find-prev" title="Previous (Shift+Enter)">↑</button>
    <button class="tb" id="find-next" title="Next (Enter)">↓</button>
    <button class="tb" id="find-one">REPLACE</button>
    <button class="tb" id="find-all">ALL</button>
    <button class="tb" id="find-close" title="Close (Esc)">×</button>
  </div>
  <aside id="left" data-side="left" hidden>
    <div class="panel-head">SCENES <span id="scene-count"></span><span id="scene-wpm" title="Dialogue words a minute, over the runtime"></span></div>
    <div id="scenes" class="list"></div>
    <div class="panel-foot" id="scene-foot"><span id="scene-runtime" title="Runtime, by the timecodes (a minute a page until there are some)"></span></div>
  </aside>
  <div id="scroller" tabindex="-1">
    <div id="content"></div>
  </div>
  <aside id="rev" hidden></aside>
  <aside id="right" hidden>
    <div class="panel-head">NOTES <span id="note-count"></span><span class="ph-acts"><button id="notes-filter" class="ph-b mbtn" title="Show only the notes of one colour" aria-label="Filter notes by colour" aria-haspopup="menu"><i></i><span class="dn">▾</span></button><button id="notes-clear" class="ph-b" title="Delete every note listed (press twice)">CLEAR ALL</button></span></div>
    <div id="notes" class="list"></div>
  </aside>
</main>
<footer id="status">
  <span id="brand" class="st"><img id="mark" src="mark.svg" width="11" height="11" alt=""><span id="ver"></span></span>
  <span id="st-el" class="st"></span>
  <span id="st-page" class="st"></span>
  <span id="st-scene" class="st"></span>
  <span id="st-words" class="st"></span>
  <span id="st-goal" class="st" title="Today's writing goal — click for statistics"></span>
  <span class="grow"></span>
  <button id="st-update" class="tb st" hidden></button>
  <span id="st-clock" class="st"></span>
  <span class="st seg" role="group" aria-label="Theme">
    <button class="tb" id="th-light" title="Light mode (Ctrl+Shift+L toggles)">LIGHT</button>
    <button class="tb" id="th-dark" title="Dark mode (Ctrl+Shift+L toggles)">DARK</button>
    <button class="tb" id="th-auto" title="Switch automatically on a schedule — right-click to set times">AUTO</button>
  </span>
  <span class="st zoom">
    <button class="tb" id="zoom-out" title="Zoom out (Ctrl+-)">−</button>
    <button class="tb" id="zoom-val" title="Reset zoom (Ctrl+0)">100%</button>
    <button class="tb" id="zoom-in" title="Zoom in (Ctrl+=)">+</button>
  </span>
</footer>
<textarea id="input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Screenplay editor"></textarea>
<div id="overlay" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
