# One-time cleanup: deletes every version tag except the newest (v0.19.4 today).
# Run it from GitHub: Actions → Remove old tags → Run workflow.
# Only the tags go; the commits and history they pointed to stay.
# This file is removed again once it has run.

name: Remove old tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Delete all tags but the newest
        run: |
          newest=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)
          echo "Keeping $newest"
          old=$(git tag --list | grep -vxF "$newest" || true)
          if [ -z "$old" ]; then echo "Nothing to remove."; exit 0; fi
          echo "$old"
          git push origin --delete $(printf 'refs/tags/%s ' $old)
          echo "Removed $(echo "$old" | wc -l) tags."
