# Build the Windows app for a version and publish it as a GitHub Release.
#
# Two ways to start it:
#   - push a tag vX.Y.Z (e.g. `git tag v0.19.5 && git push origin v0.19.5`);
#   - on GitHub: Actions → Release → Run workflow. Leave the box empty to release
#     the version in package.json (its tag vX.Y.Z must already exist).
#
# Produces a release named after the version, with its CHANGELOG.md section as the
# notes and two downloads, named the same in every release so
# releases/latest/download/<name> always gets the newest one:
#   STET-Windows.zip   STET.exe, the portable single-file program: unzip and double-click
#   STET-Setup.exe     the installer (scripts/installer/STET.iss)
# Running it again for a version that already has a release replaces its files.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v0.19.4 (empty: the version in package.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-exe.js builds from the tag via a git worktree
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Which version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } elseif ($env:INPUT_TAG) { $env:INPUT_TAG.Trim() } else { "v$version" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Not a version tag: $tag" }
          if ($tag -ne "v$version") { throw "Tag $tag does not match package.json version $version" }
          git rev-parse --verify --quiet "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE) { throw "There is no tag $tag yet" }
          "TAG=$tag" >> $env:GITHUB_ENV

      - run: npm ci

      - run: npm test

      - name: Release notes from CHANGELOG.md
        shell: bash # a plain byte redirect, so the notes stay UTF-8
        run: |
          {
            echo '**To get STET, download STET-Windows.zip below, unzip it and double-click STET.exe.**'
            echo
            node scripts/release-notes.js "$TAG"
          } > release-notes.md

      # Called with node rather than `npm run exe --`: PowerShell's npm shim drops the `--`.
      - name: Build STET.exe
        env:
          STET_EXE_DIR: ${{ runner.temp }}\stet-exe
        run: node scripts/build-exe.js $env:TAG

      - name: Check STET.exe and zip it
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'stet-exe\STET.exe'
          $built = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          if ("v$built" -ne $env:TAG) { throw "STET.exe reports version $built, expected $env:TAG (is $env:TAG the newest tag?)" }
          Compress-Archive -LiteralPath $exe -DestinationPath STET-Windows.zip -CompressionLevel Optimal

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE) { throw 'Installing Inno Setup failed' } }
          $files = Resolve-Path "dist\STET-$env:TAG-win32-x64"
          & $iscc /Q "/DAppVersion=$($env:TAG.Substring(1))" "/DAppFiles=$files" "/O$PWD" scripts\installer\STET.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed ($LASTEXITCODE)" }
          if (-not (Test-Path STET-Setup.exe)) { throw 'STET-Setup.exe was not created' }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG --notes-file release-notes.md
            gh release upload $env:TAG STET-Windows.zip STET-Setup.exe --clobber
          } else {
            gh release create $env:TAG --verify-tag --latest --title "STET $($env:TAG.Substring(1))" --notes-file release-notes.md STET-Windows.zip STET-Setup.exe
          }
          if ($LASTEXITCODE) { throw "Publishing the release failed ($LASTEXITCODE)" }
