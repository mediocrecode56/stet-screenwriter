# Build the Windows app for a version and publish it as a GitHub Release.
#
# Releasing is automatic: push a commit to main that raises the version in
# package.json (with a matching section in CHANGELOG.md) and this tags it vX.Y.Z,
# builds it and publishes the release. Pushes that don't change the version do nothing.
# It can also be started by pushing a tag vX.Y.Z, or on GitHub: Actions → Release →
# Run workflow (empty box: the version in package.json). Running it for a version that
# already has a release replaces that release's files.
#
# Each release has the version's CHANGELOG.md section as its notes and these files
# (the first two named the same in every release, so releases/latest/download/<name>
# always gets the newest one):
#   STET-Windows.zip   STET.exe, the portable single-file program: unzip and double-click
#   STET-Setup.exe     the installer (scripts/installer/STET.iss); it updates an
#                      installed STET in place
#   STET-Patch-electron-<version>.zip
#                      the in-app update for a STET running on that Electron: just
#                      STET's own files, a megabyte or two (src/main/patch.js)

name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v0.19.4 (empty: the version in package.json)'
        required: false
        default: ''

permissions:
  contents: write

# One release at a time; a second push waits for the first instead of racing it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      build: ${{ steps.which.outputs.build }}
      create: ${{ steps.which.outputs.create }}
    steps:
      - uses: actions/checkout@v4

      - name: Which version, and is there anything to do
        id: which
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME
          elif [ -n "$INPUT_TAG" ]; then tag=$(echo "$INPUT_TAG" | xargs)
          else tag=v$version; fi
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a version tag: $tag"; exit 1; }
          [ "$tag" = "v$version" ] || { echo "::error::$tag does not match package.json version $version"; exit 1; }
          node scripts/release-notes.js "$tag" > /dev/null || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

          create=false
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || create=true
          build=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && gh release view "$tag" > /dev/null 2>&1; then
            build=false
            echo "$tag is already released; nothing to do."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "create=$create" >> "$GITHUB_OUTPUT"
          echo "Release $tag: build=$build, new tag=$create"

  release:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ needs.check.outputs.tag }}
      CREATE_TAG: ${{ needs.check.outputs.create }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-exe.js builds from the tag via a git worktree
          fetch-tags: true

      # A new version is tagged here first, but the tag only goes to GitHub with the release.
      - name: Tag the new version
        if: env.CREATE_TAG == 'true'
        run: git tag $env:TAG $env:GITHUB_SHA

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Release notes from CHANGELOG.md
        shell: bash # a plain byte redirect, so the notes stay UTF-8
        run: |
          {
            echo '**To get STET, download STET-Windows.zip below, unzip it and double-click STET.exe.** Already have STET 0.20 or later? It updates itself: click UPDATE at the bottom right.'
            echo
            node scripts/release-notes.js "$TAG"
          } > release-notes.md

      # Called with node rather than `npm run exe --`: PowerShell's npm shim drops the `--`.
      - name: Build STET.exe and the patch
        env:
          STET_EXE_DIR: ${{ runner.temp }}\stet-exe
          STET_PATCH_OUT: ${{ github.workspace }}
        run: |
          node scripts/build-exe.js $env:TAG
          if ($LASTEXITCODE) { throw 'Building STET failed' }
          $patch = @(Get-ChildItem STET-Patch-electron-*.zip)
          if ($patch.Count -ne 1) { throw "Expected one patch, found $($patch.Count)" }
          "PATCH=$($patch[0].Name)" >> $env:GITHUB_ENV

      - name: Check STET.exe and zip it
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'stet-exe\STET.exe'
          $built = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          if ("v$built" -ne $env:TAG) { throw "STET.exe reports version $built, expected $env:TAG (is $env:TAG the newest tag?)" }
          Compress-Archive -LiteralPath $exe -DestinationPath STET-Windows.zip -CompressionLevel Optimal

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE) { throw 'Installing Inno Setup failed' } }
          $files = Resolve-Path "dist\STET-$env:TAG-win32-x64"
          & $iscc /Q "/DAppVersion=$($env:TAG.Substring(1))" "/DAppFiles=$files" "/O$PWD" scripts\installer\STET.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed ($LASTEXITCODE)" }
          if (-not (Test-Path STET-Setup.exe)) { throw 'STET-Setup.exe was not created' }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:CREATE_TAG -eq 'true') {
            git push origin "refs/tags/$env:TAG"
            if ($LASTEXITCODE) { throw "Pushing tag $env:TAG failed" }
          }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG --notes-file release-notes.md
            if ($LASTEXITCODE) { throw 'Updating the release notes failed' }
            gh release upload $env:TAG STET-Windows.zip STET-Setup.exe $env:PATCH --clobber
          } else {
            gh release create $env:TAG --verify-tag --latest --title "STET $($env:TAG.Substring(1))" --notes-file release-notes.md STET-Windows.zip STET-Setup.exe $env:PATCH
          }
          if ($LASTEXITCODE) { throw "Publishing the release failed ($LASTEXITCODE)" }
