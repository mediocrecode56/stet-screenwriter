# Build STET for Windows and the Mac for a version and publish it as a GitHub Release.
#
# Releasing is automatic: push a commit to main that raises the version in
# package.json (with a matching section in CHANGELOG.md) and this tags it vX.Y.Z,
# builds it and publishes the release. A push whose version is already released does
# nothing (a quick check); if a release failed, the next push to main tries it again.
# It can also be started by pushing a tag vX.Y.Z, or on GitHub: Actions → Release →
# Run workflow (empty box: the version in package.json). Running it for a version that
# already has a release replaces that release's files.
#
# Each release has the version's CHANGELOG.md section as its notes and these files
# (the first three named the same in every release, so releases/latest/download/<name>
# always gets the newest one):
#   STET-Windows.zip   STET.exe, the portable single-file program: unzip and double-click
#   STET-Setup.exe     the installer (scripts/installer/STET.iss); it updates an
#                      installed STET in place
#   STET-macOS.dmg     STET.app for Macs with Apple silicon (scripts/build-mac.js), built and
#                      tested on a Mac
#   STET-Patch-electron-<version>.zip
#                      the in-app update for a STET running on that Electron: just
#                      STET's own files, a megabyte or two (src/main/patch.js); the same
#                      on Windows and the Mac
#
# The release never waits for a Mac: the Windows job publishes it (with the previous
# release's STET-macOS.dmg, so the download link always works; that STET updates itself
# when opened) and deletes the older releases. The Mac job then builds and tests this
# version's STET-macOS.dmg and puts it in place whenever GitHub has a Mac free.
#
# Run by hand with "publish" unticked, it only builds and tests the Mac app, and keeps
# STET-macOS.dmg with the run (Artifacts), to try a change to the Mac build.

name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v0.19.4 (empty: the version in package.json)'
        required: false
        default: ''
      publish:
        description: 'Publish the release (unticked: only build and test the Mac app)'
        type: boolean
        default: true

permissions:
  contents: write

# One release at a time; a second push waits for the first instead of racing it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      build: ${{ steps.which.outputs.build }}
      create: ${{ steps.which.outputs.create }}
    steps:
      - uses: actions/checkout@v4

      - name: Which version, and is there anything to do
        id: which
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME
          elif [ -n "$INPUT_TAG" ]; then tag=$(echo "$INPUT_TAG" | xargs)
          else tag=v$version; fi
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a version tag: $tag"; exit 1; }
          [ "$tag" = "v$version" ] || { echo "::error::$tag does not match package.json version $version"; exit 1; }
          node scripts/release-notes.js "$tag" > /dev/null || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

          create=false
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || create=true
          build=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && gh release view "$tag" > /dev/null 2>&1; then
            build=false
            echo "$tag is already released; nothing to do."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "create=$create" >> "$GITHUB_OUTPUT"
          echo "Release $tag: build=$build, new tag=$create"

  release:
    needs: check
    if: needs.check.outputs.build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ needs.check.outputs.tag }}
      CREATE_TAG: ${{ needs.check.outputs.create }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-exe.js builds from the tag via a git worktree
          fetch-tags: true

      # A new version is tagged here first, but the tag only goes to GitHub with the release.
      - name: Tag the new version
        if: env.CREATE_TAG == 'true'
        run: git tag $env:TAG $env:GITHUB_SHA

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Until the Mac job has built this version's disk image, the previous one stands in.
      - name: The previous STET-macOS.dmg, for now
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prev = gh release view --json tagName -q .tagName
          if ($prev) { gh release download $prev -p STET-macOS.dmg --clobber }
          if (-not (Test-Path STET-macOS.dmg)) { throw 'No STET-macOS.dmg in the previous release' }

      - name: Release notes from CHANGELOG.md
        shell: bash # a plain byte redirect, so the notes stay UTF-8
        run: |
          {
            echo '**To get STET on Windows, download STET-Windows.zip below, unzip it and double-click STET.exe. On a Mac, download STET-macOS.dmg, open it and drag STET to Applications.** Already have STET? It updates itself: click UPDATE at the bottom right.'
            echo
            node scripts/release-notes.js "$TAG"
          } > release-notes.md

      # Called with node rather than `npm run exe --`: PowerShell's npm shim drops the `--`.
      - name: Build STET.exe and the patch
        env:
          STET_EXE_DIR: ${{ runner.temp }}\stet-exe
          STET_PATCH_OUT: ${{ github.workspace }}
        run: |
          node scripts/build-exe.js $env:TAG
          if ($LASTEXITCODE) { throw 'Building STET failed' }
          $patch = @(Get-ChildItem STET-Patch-electron-*.zip)
          if ($patch.Count -ne 1) { throw "Expected one patch, found $($patch.Count)" }
          "PATCH=$($patch[0].Name)" >> $env:GITHUB_ENV

      - name: Check STET.exe and zip it
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'stet-exe\STET.exe'
          $built = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          if ("v$built" -ne $env:TAG) { throw "STET.exe reports version $built, expected $env:TAG (is $env:TAG the newest tag?)" }
          Compress-Archive -LiteralPath $exe -DestinationPath STET-Windows.zip -CompressionLevel Optimal

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE) { throw 'Installing Inno Setup failed' } }
          $files = Resolve-Path "dist\STET-$env:TAG-win32-x64"
          & $iscc /Q "/DAppVersion=$($env:TAG.Substring(1))" "/DAppFiles=$files" "/O$PWD" scripts\installer\STET.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed ($LASTEXITCODE)" }
          if (-not (Test-Path STET-Setup.exe)) { throw 'STET-Setup.exe was not created' }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub refuses this job's token a tag push when commits since the last tag change a
          # workflow file. The release is then created with the tag made by GitHub itself (--target).
          $tagged = $true
          if ($env:CREATE_TAG -eq 'true') {
            git push origin "refs/tags/$env:TAG"
            if ($LASTEXITCODE) { Write-Host "::warning::Pushing tag $env:TAG was refused; GitHub creates it with the release."; $tagged = $false }
          }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG --notes-file release-notes.md
            if ($LASTEXITCODE) { throw 'Updating the release notes failed' }
            gh release upload $env:TAG STET-Windows.zip STET-Setup.exe STET-macOS.dmg $env:PATCH --clobber
          } else {
            $where = if ($tagged) { '--verify-tag' } else { "--target=$env:GITHUB_SHA" }
            gh release create $env:TAG $where --latest --title "STET $($env:TAG.Substring(1))" --notes-file release-notes.md STET-Windows.zip STET-Setup.exe STET-macOS.dmg $env:PATCH
          }
          if ($LASTEXITCODE) { throw "Publishing the release failed ($LASTEXITCODE)" }

      # Only the newest release is kept (their tags stay; the builds use them).
      - name: Delete the older releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 1000 --json tagName -q '.[].tagName' | Where-Object { $_ -and $_ -ne $env:TAG } | ForEach-Object {
            Write-Host "Deleting release $_"
            gh release delete $_ --yes
          }

  mac:
    needs: [check, release]
    # After the release is out (or, publish unticked, on its own); it never holds it up.
    if: always() && needs.check.outputs.build == 'true' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: macos-15 # Apple silicon
    timeout-minutes: 60
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-mac.js builds from the tag via a git worktree
          fetch-tags: true

      - name: Tag the new version here, unless the release already did
        run: git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || git tag "$TAG" "$GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build STET.app and STET-macOS.dmg
        env:
          STET_DMG_OUT: ${{ github.workspace }}
        run: node scripts/build-mac.js "$TAG"

      # The disk image as it will be downloaded: it opens, holds a signed STET.app of this
      # version, and that STET starts, works and updates itself with a patch.
      - name: Check and test the app in the disk image
        run: |
          mnt=$(mktemp -d)
          hdiutil attach STET-macOS.dmg -nobrowse -readonly -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt" -force' EXIT
          app="$mnt/STET.app"
          test -L "$mnt/Applications"
          codesign --verify --deep --strict "$app"
          built=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          [ "v$built" = "$TAG" ] || { echo "::error::STET.app reports version $built, expected $TAG"; exit 1; }
          file "$app/Contents/MacOS/STET" | grep -q arm64
          # Screenplays show STET's icon: the file the document type names is STET's icon.
          docicon=$(/usr/libexec/PlistBuddy -c 'Print CFBundleDocumentTypes:0:CFBundleTypeIconFile' "$app/Contents/Info.plist")
          cmp "$app/Contents/Resources/$docicon" build/icon.icns || { echo "::error::.stet files would not show STET's icon ($docicon)"; exit 1; }
          STET_E2E_EXE="$app/Contents/MacOS/STET" STET_E2E_START_MS=120000 node --test --test-concurrency=1 test/e2e/app.e2e.js test/e2e/patch.e2e.js
          # Help > Open .stet Files with STET, for real: STET becomes the default app for them.
          STET_E2E_LINK=1 STET_E2E_EXE="$app/Contents/MacOS/STET" STET_E2E_START_MS=120000 node --test test/e2e/links.e2e.js

      - uses: actions/upload-artifact@v4
        with:
          name: STET-macOS
          path: STET-macOS.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Put this version's STET-macOS.dmg in the release
        if: needs.release.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" STET-macOS.dmg --clobber
